name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Create cache volume
        run: docker volume create f1-cache

      - name: Start services
        run: docker compose up --build --wait --wait-timeout 120

      - name: Check API health
        run: curl --fail --show-error --silent --retry 5 --retry-connrefused --retry-delay 2 --max-time 5 http://127.0.0.1:8080/api/health

      - name: Show service status and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down

  
permissions:
  contents: read

