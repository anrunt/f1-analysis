name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: 
          node-version: '24'
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  
permissions:
  contents: read

