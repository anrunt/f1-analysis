name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Create cache volume
        run: docker volume create f1-cache

      - name: Start services
        run: docker compose up --build --wait --wait-timeout 120

      - name: Check API health
        run: curl --fail --show-error --silent --retry 5 --retry-connrefused --retry-delay 2 --max-time 5 http://127.0.0.1:8080/api/health

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: 'ghcr.io'
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'

      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker tag f1-backend:local ghcr.io/anrunt/f1-analysis-backend:$GITHUB_SHA
          docker tag f1-frontend:local ghcr.io/anrunt/f1-analysis-frontend:$GITHUB_SHA

          docker push ghcr.io/anrunt/f1-analysis-backend:$GITHUB_SHA
          docker push ghcr.io/anrunt/f1-analysis-frontend:$GITHUB_SHA

      - name: Show service status and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down

    permissions:
      contents: read
      packages: write

  
permissions:
  contents: read

